name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: python scripts/validate_skills.py
      - name: Knowledge-graph view is current (litlfred fork)
        run: python3 -I tools/kg-index/kg_index.py --check
      - name: Run skill script and eval grader tests
        run: |
          for d in skills/*/scripts evals/*; do
            if ls "$d"/test_*.py >/dev/null 2>&1; then
              python -m pytest -q -p no:cacheprovider "$d"
            fi
          done

  # litlfred fork: the cat-harness layer. Actions are pinned by commit SHA; the
  # harness layers come from index.lock.json, the workspaces from the frozen
  # bun.lock with no install scripts. The checks are the ones that judge this
  # layer (HARNESS.md); the ones still red in the pinned layers are bean HK-01.
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # `bun run cat mount:lock` lives in cat-harness-tools, itself a mount, so
      # its replayer (scripts/mount-from-lock.ts, node:* imports only) is fetched
      # first at the commit the lock pins; it verifies each tree digest.
      - name: Mount the harness layers from index.lock.json
        run: |
          set -euo pipefail
          read -r repo sha < <(python3 -c 'import json; i = next(x for x in json.load(open("index.lock.json"))["instances"] if x["instance"] == "cat-harness-tools"); print(i["repository"], i["sha"])')
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" fetch -q --depth 1 --filter=blob:none "https://github.com/${repo}.git" "$sha"
          git -C "$work" checkout -q FETCH_HEAD -- scripts/mount-from-lock.ts
          bun "$work/scripts/mount-from-lock.ts" --root . --no-install
      - name: Install the workspaces, frozen, without install scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Every mount is on disk and hashes to the lock
        run: bun run cat mount:lock
      - name: The checks that judge this layer
        run: |
          set -euo pipefail
          for s in harness:dirs:check check:schema-nodes node-kinds:check subgraph:jsonld:check \
                   check:process-bindings check:process-documentation bpmn:checklist:check \
                   check:bean-front-matter check:asset-roles check:declaration-claims; do
            echo "::group::$s"; bun run cat "$s"; echo "::endgroup::"
          done
